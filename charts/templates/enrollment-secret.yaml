{{- if .Values.enrollmentSecret.enabled }}
{{- $secret := .Values.enrollmentSecret }}
{{- $upstream := index .Values "infisical-gateway" }}
{{- if ne $secret.secretName $upstream.gateway.enrollment.token.existingSecretRef }}
{{- fail "enrollmentSecret.secretName must match infisical-gateway.gateway.enrollment.token.existingSecretRef when enrollmentSecret is enabled" }}
{{- end }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ $secret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infisical-gateway-wrapper.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when enrollmentSecret is enabled" .Values.infisical.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when enrollmentSecret is enabled" .Values.infisical.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: {{ $secret.refreshInterval | quote }}
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when enrollmentSecret is enabled" .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when enrollmentSecret is enabled" .Values.infisical.environmentSlug | quote }}
      secretPath: {{ $secret.secretPath | quote }}
      recursive: {{ $secret.recursive }}
  targets:
    - name: {{ $secret.secretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: Opaque
      # Keep the Secret if this resource is deleted.
      creationPolicy: Orphan
      metadata:
        labels: {}
        annotations: {}
      template:
        engineVersion: v1
        data:
          enrollment-token: {{ "{{ .GATEWAY_ENROLLMENT_TOKEN.Value }}" | quote }}
{{- end }}
