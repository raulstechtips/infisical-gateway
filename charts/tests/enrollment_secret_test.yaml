suite: Enrollment token secret
templates:
  - templates/enrollment-secret.yaml
release:
  name: infisical-gateway
  namespace: infisical-gateway
tests:
  - it: renders no secret by default
    asserts:
      - hasDocuments:
          count: 0
  - it: syncs only the enrollment token and leaves it orphaned
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - equal:
          path: metadata.name
          value: infisical-gateway-enrollment-token
      - equal:
          path: metadata.namespace
          value: infisical-gateway
      - equal:
          path: spec.infisicalAuthRef
          value:
            name: fake-universal-auth
            namespace: fake-auth
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.sources
          value:
            - projectSlug: fake-project
              environmentSlug: fake-environment
              secretPath: /infisical/gateway
              recursive: true
      - equal:
          path: spec.targets
          value:
            - name: infisical-gateway-enrollment-token
              namespace: infisical-gateway
              kind: Secret
              secretType: Opaque
              creationPolicy: Orphan
              metadata:
                labels: {}
                annotations: {}
              template:
                engineVersion: v1
                data:
                  enrollment-token: "{{ .GATEWAY_ENROLLMENT_TOKEN.Value }}"
