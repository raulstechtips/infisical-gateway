suite: Upstream gateway wiring
templates:
  - charts/infisical-gateway/templates/deployment.yaml
  - charts/infisical-gateway/templates/pvc.yaml
  - charts/infisical-gateway/templates/service.yaml
  - charts/infisical-gateway/templates/serviceaccount.yaml
  - charts/infisical-gateway/templates/serviceaccount-token-reviewer.yaml
  - charts/infisical-gateway/templates/secret.yaml
release:
  name: infisical-gateway
  namespace: infisical-gateway
tests:
  - it: keeps the gateway image resources arguments and durable credentials
    template: charts/infisical-gateway/templates/deployment.yaml
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal:
          path: metadata.name
          value: infisical-gateway
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: infisical/cli:0.43.84
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 128Mi
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - gateway
            - start
            - fake-gateway
            - --enroll-method=token
            - --domain=https://infisical.example.test
            - --token=$(INFISICAL_ENROLLMENT_TOKEN)
            - --target-relay-name=fake-relay
            - --pam-session-recording-path=/var/lib/infisical/session_recordings
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INFISICAL_ENROLLMENT_TOKEN
            valueFrom:
              secretKeyRef:
                name: infisical-gateway-enrollment-token
                key: enrollment-token
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-data
            persistentVolumeClaim:
              claimName: infisical-gateway-data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-data
            mountPath: /home/infisical
            subPath: credentials
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-data
            mountPath: /var/lib/infisical/session_recordings
            subPath: session-recordings
  - it: keeps the PVC name capacity and access mode
    template: charts/infisical-gateway/templates/pvc.yaml
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal:
          path: metadata.name
          value: infisical-gateway-data
      - equal:
          path: spec
          value:
            accessModes: [ReadWriteOnce]
            storageClassName: fake-storage-class
            resources:
              requests:
                storage: 5Gi
  - it: keeps the gateway Service port
    template: charts/infisical-gateway/templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: infisical-gateway
      - equal:
          path: spec.ports[0].port
          value: 80
  - it: keeps the gateway ServiceAccount name
    template: charts/infisical-gateway/templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: infisical-gateway
  - it: keeps auth delegator binding and subject
    template: charts/infisical-gateway/templates/serviceaccount-token-reviewer.yaml
    asserts:
      - equal:
          path: metadata.name
          value: infisical-gateway-system-auth-delegator-cluster-rolebinding
      - equal:
          path: roleRef.name
          value: system:auth-delegator
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: infisical-gateway
            namespace: infisical-gateway
  - it: renders no inline token Secret
    template: charts/infisical-gateway/templates/secret.yaml
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - hasDocuments:
          count: 0
